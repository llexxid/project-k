<style>
#pk-checkin-mail {--wood:#261d15;--deep:#19130e;--surface:#382b1e;--bronze:#8d6b42;--edge:#c7a16a;--ink:#f3e7d2;--muted:#b7ab98;--gold:#ffe2a0;--green:#a7c8a1;--line:#5d4931;font-family:'Malgun Gothic',sans-serif;color:var(--ink);font-size:14px;line-height:1.45;}
#pk-checkin-mail *{box-sizing:border-box}
#pk-checkin-mail button{font:inherit;color:inherit;touch-action:manipulation}
#pk-checkin-mail .preview{padding:16px 0 22px}
#pk-checkin-mail .preview-nav{display:flex;gap:8px;max-width:420px;margin:0 auto 10px;padding:0 4px}
#pk-checkin-mail .preview-nav button{flex:1;min-height:44px;border:1px solid var(--bronze);background:var(--deep);border-radius:3px}
#pk-checkin-mail .preview-nav button[aria-pressed=true]{background:#594025;border-color:var(--edge);color:var(--gold)}
#pk-checkin-mail .device{max-width:420px;width:100%;margin:auto;background:var(--deep);border:1px solid var(--bronze);position:relative;container-type:inline-size}
#pk-checkin-mail .draft{font-size:11px;color:var(--muted);text-align:center;padding:7px 2px;background:#20180f;border-bottom:1px solid var(--line)}
#pk-checkin-mail .hud{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#211910;border-bottom:1px solid var(--bronze)}
#pk-checkin-mail .level{width:38px;height:38px;border:1px solid var(--bronze);display:grid;place-items:center;font-size:11px;border-radius:50%}
#pk-checkin-mail .wallet{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;background:#16100b;font-size:12px}
#pk-checkin-mail img{object-fit:contain;image-rendering:pixelated}
#pk-checkin-mail .wallet img{width:21px;height:21px}
#pk-checkin-mail .icon-button{border:0;background:transparent;min-width:44px;min-height:44px;display:grid;place-items:center}
#pk-checkin-mail .stage{height:570px;position:relative;display:flex;align-items:center;justify-content:center;padding:12px 6px;background:#151c15;isolation:isolate}
#pk-checkin-mail .panel{width:100%;display:flex;flex-direction:column;background:var(--wood);border:1px solid var(--bronze);max-height:100%;position:relative;box-shadow:0 5px 16px #0005}
#pk-checkin-mail .panel:before,#pk-checkin-mail .panel:after{content:'';position:absolute;width:10px;height:10px;border-color:var(--edge);border-style:solid;pointer-events:none;z-index:1}
#pk-checkin-mail .panel:before{top:4px;left:4px;border-width:2px 0 0 2px}
#pk-checkin-mail .panel:after{bottom:4px;right:4px;border-width:0 2px 2px 0}
#pk-checkin-mail .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 5px 6px 14px;min-height:54px;background:var(--deep);border-bottom:1px solid var(--line);flex-shrink:0}
#pk-checkin-mail h2{font-size:18px;font-weight:600;color:var(--gold);margin:0}
#pk-checkin-mail p{margin:0}
#pk-checkin-mail .body{padding:12px;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bronze) var(--deep)}
#pk-checkin-mail .checkin-body{overflow:visible;padding:10px 8px}
#pk-checkin-mail .spread{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#pk-checkin-mail .small{font-size:12px;color:var(--muted)}
#pk-checkin-mail .month{color:var(--gold);font-size:15px;font-weight:600}
#pk-checkin-mail .count{font-size:12px;padding:4px 7px;background:#493720;color:var(--gold);border:1px solid var(--bronze);white-space:nowrap}
#pk-checkin-mail .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px 4px;margin:12px 0 9px}
#pk-checkin-mail .day{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border:1px solid var(--line);padding:4px 1px;background:var(--deep);min-width:0;min-height:72px;font-size:11px;line-height:1.15}
#pk-checkin-mail .day-label{white-space:nowrap}
#pk-checkin-mail .slot-picture{display:block;position:relative;width:54px;height:58px;background:#17110c;border:1px solid var(--bronze);box-shadow:inset 0 0 0 2px #302319}
#pk-checkin-mail .slot-picture img{position:absolute;width:35px;height:35px;left:50%;top:4px;transform:translateX(-50%)}
#pk-checkin-mail .qty{position:absolute;bottom:1px;right:2px;left:1px;text-align:right;font-size:12px;line-height:1.25;font-weight:700;color:var(--ink);text-shadow:1px 1px #000;background:#17110cd9;padding:0 2px}
#pk-checkin-mail .day .slot-picture{width:calc(100% - 2px);height:44px}
#pk-checkin-mail .day .slot-picture img{width:28px;height:28px;top:3px}
#pk-checkin-mail .day .qty{font-size:11px;padding:0}
#pk-checkin-mail .day.available{border-color:var(--edge);background:#5a4023;box-shadow:inset 0 0 0 1px #d4ad6f}
#pk-checkin-mail .day.claimed{color:var(--muted)}
#pk-checkin-mail .day.claimed img{opacity:.5}
#pk-checkin-mail .day .check-mark{position:absolute;top:0;left:1px;color:var(--green);font-size:17px;line-height:1;font-weight:700;text-shadow:1px 1px #000}
#pk-checkin-mail .day.locked{color:var(--muted)}
#pk-checkin-mail .day.locked img{opacity:.6}
#pk-checkin-mail .footer{flex-shrink:0;border-top:1px solid var(--line);background:var(--deep);padding:11px 12px}
#pk-checkin-mail .checkin-footer{text-align:center;font-size:13px;color:var(--gold);min-height:42px;font-variant-numeric:tabular-nums}
#pk-checkin-mail .mail-panel{height:100%}
#pk-checkin-mail .mail-panel>.body{flex:1}
#pk-checkin-mail .mail-summary{display:flex;gap:12px;padding:0 0 9px;color:var(--muted);font-size:12px}
#pk-checkin-mail .mail-summary strong{color:var(--gold);font-weight:500}
#pk-checkin-mail .mail-list{display:grid;gap:8px}
#pk-checkin-mail .mail-row{border:1px solid var(--line);background:var(--surface);padding:9px;position:relative}
#pk-checkin-mail .mail-title{background:transparent;border:0;color:var(--ink);padding:0;width:100%;display:flex;gap:6px;align-items:center;justify-content:space-between;text-align:left;min-height:40px;font-size:13px}
#pk-checkin-mail .mail-state{font-size:11px;color:var(--gold);margin-left:5px;white-space:nowrap}
#pk-checkin-mail .mail-row.claimed .mail-state{color:var(--green)}
#pk-checkin-mail .mail-row.claimed{background:#30291f}
#pk-checkin-mail .mail-row.claimed .slot-picture img{opacity:.55}
#pk-checkin-mail .reward-slots{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
#pk-checkin-mail .reward-slot{border:0;padding:0;background:transparent;min-height:44px;min-width:44px}
#pk-checkin-mail .mail-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pk-checkin-mail .receive{min-width:75px;min-height:46px;border:1px solid var(--bronze);background:#664624;font-size:12px}
#pk-checkin-mail .mail-meta{display:flex;justify-content:space-between;gap:5px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted)}
#pk-checkin-mail .footer-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
#pk-checkin-mail .action{border:1px solid var(--edge);background:#674824;min-height:48px;padding:8px;font-size:13px;font-weight:600;width:100%}
#pk-checkin-mail .action.secondary{background:var(--surface);border-color:var(--bronze);font-size:12px;font-weight:400}
#pk-checkin-mail button:disabled{background:#302b24;color:#a99e8b;border-color:#635640;box-shadow:none}
#pk-checkin-mail .bottom-nav{display:flex;justify-content:space-around;padding:10px 0 14px;background:var(--deep);border-top:1px solid var(--bronze)}
#pk-checkin-mail .bottom-nav span{display:grid;justify-items:center;gap:3px;color:var(--muted);font-size:12px}
#pk-checkin-mail .bottom-nav svg{width:20px;height:20px}
#pk-checkin-mail .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:#080705b8;z-index:5}
#pk-checkin-mail .overlay .panel{max-height:96%}
#pk-checkin-mail .item-info{text-align:center;padding:23px 20px 28px;align-items:center;gap:12px;min-height:230px}
#pk-checkin-mail .item-info>.icon-button{position:absolute;right:3px;top:3px}
#pk-checkin-mail .item-art{width:70px;height:76px;padding:6px;background:var(--deep);border:1px solid var(--bronze)}
#pk-checkin-mail .item-art img{width:100%;height:100%}
#pk-checkin-mail .item-info p{font-size:13px;color:var(--muted);max-width:270px;line-height:1.65}
#pk-checkin-mail .receipt{padding:18px 6px;display:grid;gap:15px;justify-items:center;text-align:center}
#pk-checkin-mail .detail-copy{padding:20px 0;line-height:1.8;font-size:13px;white-space:pre-line}
#pk-checkin-mail .empty{padding:65px 8px;text-align:center;color:var(--muted);display:grid;gap:12px}
#pk-checkin-mail .home{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:var(--muted)}
#pk-checkin-mail .menu{align-self:flex-end;width:195px;display:grid;background:var(--wood);border:1px solid var(--bronze)}
#pk-checkin-mail .menu button{padding:13px;text-align:left;min-height:48px;background:transparent;border:0;border-bottom:1px solid var(--line)}
#pk-checkin-mail .menu span{float:right;color:var(--gold)}
#pk-checkin-mail .toast{position:absolute;bottom:18px;left:14px;right:14px;padding:10px;background:#221b13;border:1px solid var(--edge);font-size:13px;text-align:center;z-index:9}
@media(max-width:360px){#pk-checkin-mail .stage{padding:10px 3px;height:580px}#pk-checkin-mail .checkin-body{padding:9px 4px}#pk-checkin-mail .grid{gap:6px 2px}#pk-checkin-mail .body:not(.checkin-body){padding:8px}#pk-checkin-mail .mail-row{padding:7px}#pk-checkin-mail .footer{padding:9px 7px}#pk-checkin-mail .footer-actions{gap:6px}}
</style>

 function restore(saved){
  const s=saved?.privateContent?.ui;
  if(!s||s.version!==1||!['accumulated','next-day','full-month','rollover'].includes(s.scenario))return false;
  const f=fixture(s.scenario);f.screen=['checkin','mail','home'].includes(s.screen)?s.screen:'checkin';
  f.claimed=Array.isArray(s.claimed)?s.claimed.filter(d=>Number.isInteger(d)&&d>=1&&d<=f.visits):f.claimed;
  if(Array.isArray(s.deletedIds))f.mails=f.mails.filter(m=>!s.deletedIds.includes(m.id));
  if(Array.isArray(s.claimedMailIds))f.mails.forEach(m=>{if(s.claimedMailIds.includes(m.id))m.claimed=true;});
  if(s.wallet&&Object.keys(f.wallet).every(k=>Number.isFinite(s.wallet[k])&&s.wallet[k]>=0))f.wallet={...s.wallet};
  if(JSON.stringify(state)===JSON.stringify(f))return false;
  state=f;design.scenario=f.scenario;return true;
 }
 restore(window.openai?.widgetState);
 function persist(){
  const base=fixture(state.scenario);
  const privateContent={ui:{version:1,scenario:state.scenario,screen:state.screen,claimed:[...state.claimed],claimedMailIds:state.mails.filter(m=>m.claimed).map(m=>m.id),deletedIds:base.mails.filter(m=>!state.mails.some(x=>x.id===m.id)).map(m=>m.id),wallet:{...state.wallet}}};
  const modelContent={screen:state.screen,scenario:state.scenario,month:state.month,checkedInDays:state.visits,claimedSlots:state.claimed.length,mailCount:state.mails.length,claimedMailCount:state.mails.filter(m=>m.claimed).length};
  if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent,privateContent})).catch(()=>{});
 }
 const available=()=>Array.from({length:state.visits},(_,i)=>i+1).filter(d=>!state.claimed.includes(d));
 const pendingMails=()=>state.mails.filter(m=>!m.claimed);
 const header=title=>`<header class="panel-head"><h2>${title}</h2><button type="button" class="icon-button" data-act="close" aria-label="닫기">✕</button></header>`;
 const action=(label,act,secondary=false,disabled=false)=>`<button type="button" class="action ${secondary?'secondary':''}" data-act="${act}" ${disabled?'disabled':''}>${label}</button>`;
 const panel=(title,body,foot='',cls='')=>`<section class="panel ${cls}">${header(title)}<div class="body ${cls==='checkin-panel'?'checkin-body':''}">${body}</div>${foot?`<footer class="footer ${cls==='checkin-panel'?'checkin-footer':''}">${foot}</footer>`:''}</section>`;
 function countdownText(){
  if(clockScenario!==state.scenario){
   const examples={accumulated:['2026-10-25T15:35:50+09:00','2026-10-26T00:00:00+09:00'],'next-day':['2026-10-26T15:35:50+09:00','2026-10-27T00:00:00+09:00'],'full-month':['2026-10-29T15:35:50+09:00','2026-11-01T00:00:00+09:00'],rollover:['2026-11-01T15:35:50+09:00','2026-11-02T00:00:00+09:00']};
   const [now,next]=examples[state.scenario];clockScenario=state.scenario;clockDeadline=performance.now()+Date.parse(next)-Date.parse(now);
  }
  const seconds=Math.max(0,Math.ceil((clockDeadline-performance.now())/1000));
  const values=[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(n=>String(n).padStart(2,'0'));
  return `다음 보상까지 ${values.join(' : ')}`;
 }
 function updateCountdown(){const label=root.querySelector('[data-checkin-countdown]');if(label){const text=countdownText();if(label.textContent!==text)label.textContent=text;}}
 function checkin(){
  const grid=rewards.map((r,i)=>{const d=i+1,done=state.claimed.includes(d),ready=d<=state.visits&&!done;return `<button type="button" class="day ${done?'claimed':ready?'available':'locked'}" data-day="${d}" aria-label="${d}일차 ${catalog[r.key].name} ${format(r.amount)}, ${ready?'활성 미수령 보상 모두 받기':done?'수령 완료, 아이템 정보':'미출석, 아이템 정보'}"><span class="day-label">${d}일차</span>${picture(r,done)}</button>`;}).join('');
  return panel('월간 출석',`<div class="spread"><span class="month">${state.month}월 출석부</span><span class="count">누적 ${state.visits} / 28일</span></div><div class="grid" aria-label="28일 출석 보상, 7열 4행">${grid}</div>`,`<span role="timer" aria-live="off" data-checkin-countdown>${countdownText()}</span>`,'checkin-panel');
 }
 function mailRow(m){return `<article class="mail-row ${m.claimed?'claimed':''}" data-mail-row="${m.id}"><button type="button" class="mail-title" data-mail="${m.id}"><span>${m.title}<span class="mail-state">${m.claimed?'수령 완료':'미수령'}</span></span><span aria-hidden="true">›</span></button><div class="mail-actions">${slots(m.items)}<button type="button" class="receive" data-claim="${m.id}" ${m.claimed?'disabled':''}>${m.claimed?'수령 완료':'받기'}</button></div><div class="mail-meta"><span>${m.sender}</span><span>${m.expiry}</span></div></article>`;}
 function mailbox(){
  const count=pendingMails().length,done=state.mails.filter(m=>m.claimed).length;
  return panel('우편함',`<div class="mail-summary"><span>전체 ${state.mails.length}</span><strong>미수령 ${count}</strong><span>수령 완료 ${done}</span></div><div class="mail-list">${state.mails.length?state.mails.map(mailRow).join(''):'<div class="empty"><span>우편함이 비어 있습니다.</span><span class="small">새 우편이 도착하면 알려드릴게요.</span></div>'}</div>`,`<div class="footer-actions">${action(`모두 받기${count?' ('+count+')':''}`,'claim-mail-all',false,!count)}${action('수령한 우편 삭제','delete-claimed',true,!done)}</div>`,'mail-panel');
 }
 function home(){return `<section class="home"><nav class="menu" aria-label="메뉴"><button type="button" data-screen="checkin">월간 출석 <span>${available().length?'●':''}</span></button><button type="button" data-screen="mail">우편함 <span>${pendingMails().length||''}</span></button><p class="small" style="padding:12px">기존 보관함 · 가이드 · 설정</p></nav><p class="small">스테이지 1-8 · 전투 영역</p></section>`;}
 function hydrate(){root.querySelectorAll('[data-asset]').forEach(el=>el.src=assets[el.dataset.asset]);root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});}
 function render(){
  stage.dataset.screen=state.screen;stage.innerHTML=state.screen==='checkin'?checkin():state.screen==='mail'?mailbox():home();
  root.querySelectorAll('.preview-nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===state.screen));
  root.querySelectorAll('[data-balance]').forEach(el=>el.textContent=format(state.wallet[el.dataset.balance]));hydrate();
 }
 function toast(message){clearTimeout(toastTimer);root.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.setAttribute('role','status');node.textContent=message;stage.append(node);toastTimer=setTimeout(()=>node.remove(),3500);}
 function openModal(markup,label,owner=''){
  const focus=document.activeElement;stage.querySelectorAll(':scope > .panel,:scope > .overlay').forEach(el=>{el.inert=true;el.setAttribute('aria-hidden','true');el.removeAttribute('aria-modal');});
  const wrap=document.createElement('div');wrap.className='overlay';wrap.dataset.owner=owner;wrap.setAttribute('role','dialog');wrap.setAttribute('aria-modal','true');wrap.setAttribute('aria-label',label);wrap.innerHTML=markup;wrap._focus=focus;stage.append(wrap);wrap.querySelectorAll('[data-act="close"]').forEach(b=>b.dataset.act='dismiss');hydrate();wrap.querySelector('button:not(:disabled)')?.focus();return wrap;
 }
 function closeModal(){const current=[...stage.querySelectorAll('.overlay')].at(-1);if(!current)return;const focus=current._focus;current.remove();const back=[...stage.querySelectorAll('.overlay')].at(-1)||stage.querySelector(':scope > .panel');if(back){back.inert=false;back.removeAttribute('aria-hidden');if(back.classList.contains('overlay'))back.setAttribute('aria-modal','true');}if(focus?.isConnected&&!focus.closest('[inert]'))focus.focus();}
 function itemInfo(key){const item=catalog[key];if(!item)return;openModal(`<section class="panel item-info"><button type="button" class="icon-button" data-act="dismiss" aria-label="아이템 정보 닫기">✕</button><div class="item-art">${image(key)}</div><h2>${item.name}</h2><p>${item.description}</p></section>`,`${item.name} 아이템 정보`);}
 function detail(id){const m=state.mails.find(x=>x.id===id);if(!m)return;openModal(panel(m.title,`<div class="spread small"><span>${m.sender}</span><span>${m.expiry}</span></div><p class="detail-copy">${m.body}</p>${slots(m.items)}`,m.claimed?action('수령 완료','dismiss',false,true):`<button type="button" class="action" data-claim="${m.id}">받기</button>`),'우편 상세',id);}
 function receipt(items,label){openModal(panel('보상 획득',`<div class="receipt"><p class="small">${label}</p>${slots(sum(items))}</div>`,action('확인','dismiss')),'보상 획득');}
 function credit(items){items.forEach(r=>state.wallet[r.key]+=r.amount);}
 function claimCheckin(){const days=available();if(!days.length)return;const items=days.map(d=>rewards[d-1]);state.claimed.push(...days);credit(items);render();receipt(items,`미수령 출석 보상 ${days.length}일분`);persist();}
 function claimMail(ids){const targets=state.mails.filter(m=>ids.includes(m.id));if(!targets.length||targets.length!==ids.length||targets.some(m=>m.claimed))return;const owner=[...stage.querySelectorAll('.overlay')].find(el=>el.dataset.owner)?.dataset.owner;const items=targets.flatMap(m=>m.items);targets.forEach(m=>m.claimed=true);credit(items);render();if(owner&&state.mails.some(m=>m.id===owner))detail(owner);receipt(items,`${targets.length}개 우편 수령 완료`);persist();}
 root.addEventListener('click',e=>{
  if(e.target.classList.contains('overlay')){closeModal();return;}
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.screen){state.screen=b.dataset.screen;render();persist();return;}
  if(b.dataset.day){const day=Number(b.dataset.day);if(available().includes(day))claimCheckin();else itemInfo(rewards[day-1].key);return;}
  if(b.dataset.item){itemInfo(b.dataset.item);return;}
  if(b.dataset.mail){detail(b.dataset.mail);return;}
  if(b.dataset.claim){claimMail([b.dataset.claim]);return;}
  switch(b.dataset.act){
   case 'home':case 'close':state.screen='home';render();persist();break;
   case 'dismiss':closeModal();break;
   case 'claim-mail-all':claimMail(pendingMails().map(m=>m.id));break;
   case 'delete-claimed':{const count=state.mails.filter(m=>m.claimed).length;if(!count)return;state.mails=state.mails.filter(m=>!m.claimed);render();toast(`수령한 우편 ${count}개를 삭제했습니다.`);persist();break;}
  }
 });
 root.addEventListener('keydown',e=>{
  const top=[...stage.querySelectorAll('.overlay')].at(-1);
  if(e.key==='Escape'){if(top)closeModal();else{state.screen='home';render();persist();}return;}
  if(e.key==='Tab'&&top){const bs=[...top.querySelectorAll('button:not(:disabled)')],first=bs[0],last=bs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
 });
 window.addEventListener('openai:set_globals',e=>{if(restore(e.detail?.globals?.widgetState))render();});
 render();
 const countdownTimer=setInterval(()=>{if(!root.isConnected){clearInterval(countdownTimer);return;}updateCountdown();},1000);
 if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.device'),onChange:()=>{state=fixture(design.scenario);render();persist();}});tweak.addSelect(design,'scenario',{label:'출석·우편 상태 예시',options:[{label:'10월 · 미수령 4일 누적',value:'accumulated'},{label:'다음날 · 미수령 5일 누적',value:'next-day'},{label:'28일 출석 · 미수령 4일',value:'full-month'},{label:'11월 1일 · 지난달 보상 우편 이월',value:'rollover'}]});}
})();
</script>
